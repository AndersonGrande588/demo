version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: facturacion_db
    environment:
      POSTGRES_USER: facturacion_user
      POSTGRES_PASSWORD: facturacion_pass
      POSTGRES_DB: facturacion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion_user -d facturacion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facturacion_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://facturacion_user:facturacion_pass@db:5432/facturacion_db
      SECRET_KEY: hayabuza-facturacion-secret-key-2026-anderson-grande
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    container_name: facturacion_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data: