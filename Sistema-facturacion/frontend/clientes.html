<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Sistema de Facturacion Hayabuza</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>HAYABUZA</h2>
                <p>Sistema de Facturacion</p>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">&#128200; Dashboard</a></li>
                <li><a href="clientes.html" class="active">&#128100; Clientes</a></li>
                <li><a href="facturas.html">&#128179; Facturas</a></li>
                <li><a href="nueva-factura.html">&#10133; Nueva Factura</a></li>
                <li class="admin-only"><a href="usuarios.html">&#128101; Usuarios</a></li>
            </ul>
            <div class="user-info">
                <div class="name" id="userName">--</div>
                <div class="role" id="userRole">--</div>
                <button class="btn btn-sm btn-secondary" onclick="logout()">Cerrar Sesion</button>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="top-bar">
                <h1>Gestion de Clientes</h1>
                <button class="btn btn-success" onclick="openModal()">+ Nuevo Cliente</button>
            </div>
            
            <div id="alert" class="alert"></div>
            
            <div class="card">
                <div class="search-bar">
                    <input type="text" id="searchClientes" placeholder="Buscar por nombre o documento...">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Documento</th>
                                <th>Telefono</th>
                                <th>Email</th>
                                <th>Direccion</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientesTable">
                            <tr><td colspan="6" style="text-align:center;">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>
        </main>
    </div>
    
    <!-- Modal -->
    <div class="modal-overlay" id="clienteModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Cliente</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="clienteForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Documento *</label>
                        <input type="text" id="documento" required>
                    </div>
                    <div class="form-group">
                        <label>Telefono</label>
                        <input type="text" id="telefono">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label>Direccion</label>
                        <textarea id="direccion" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancelar" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
