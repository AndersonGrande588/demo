<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Facturacion Hayabuza</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">H</div>
            <h1>HAYABUZA</h1>
            <p class="subtitle">Sistema Web de Facturacion</p>
            
            <div id="alert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electronico</label>
                    <input type="email" id="email" required placeholder="ingresa tu usuario">
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" required placeholder="ingresa tu contraseña">
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Iniciar Sesion</button>
            </form>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Iniciando sesion...</p>
            </div>
            
            <p style="margin-top: 20px; font-size: 12px; color: #95a5a6;">
                v1.0.0 | Anderson Grande
            </p>
        </div>
    </div>
    
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
